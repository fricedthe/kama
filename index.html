<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かま</title>
    <style>
        /* 1秒ごとにRGBが変化する背景 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: rgb(255, 0, 0);
            animation: rgbBackground 1s infinite linear;
        }

        @keyframes rgbBackground {
            0%   { background-color: rgb(255, 0, 0); }   /* 赤 */
            33%  { background-color: rgb(0, 255, 0); }   /* 緑 */
            66%  { background-color: rgb(0, 0, 255); }   /* 青 */
            100% { background-color: rgb(255, 0, 0); }   /* 赤に戻る */
        }

        /* 超高速回転する巨大メッセージ（見やすさ改良版） */
        .spinning-text {
            font-size: 8rem;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
            user-select: none;
            
            /* 文字を見やすくするための強力な黒縁取り */
            text-shadow: 
                -3px -3px 0 #000,  
                 3px -3px 0 #000,
                -3px  3px 0 #000,
                 3px  3px 0 #000,
                -5px  0px 0 #000,
                 5px  0px 0 #000,
                 0px -5px 0 #000,
                 0px  5px 0 #000,
                 0px  0px 20px rgba(0,0,0,0.8); /* 外側のぼかし影 */

            animation: spin 0.2s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="spinning-text">カマインクラフト</div>

</body>
</html>
