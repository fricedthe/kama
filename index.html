<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かま</title>
    <style>
        /* 1秒ごとにRGBが変化する背景 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: rgb(255, 0, 0);
            animation: rgbBackground 1s infinite linear;
        }

        @keyframes rgbBackground {
            0%   { background-color: rgb(255, 0, 0); }   /* 赤 */
            33%  { background-color: rgb(0, 255, 0); }   /* 緑 */
            66%  { background-color: rgb(0, 0, 255); }   /* 青 */
            100% { background-color: rgb(255, 0, 0); }   /* 赤に戻る */
        }

        /* 文字の視認性を最優先した回転コンテナ */
        .spinning-container {
            padding: 20px 50px;
            background-color: rgba(0, 0, 0, 0.75); /* 文字の後ろに黒い背景を敷く */
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: inline-block;
            white-space: nowrap;
            
            /* スピードを少しだけ調整（0.2秒から0.5秒へ落としてブレを軽減） */
            animation: spin 0.5s infinite linear;
        }

        /* 巨大メッセージ */
        .text {
            font-size: 7rem;
            font-weight: 900;
            font-family: 'sans-serif', 'Arial Black', sans-serif;
            color: #ffffff;
            user-select: none;
            margin: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="spinning-container">
        <h1 class="text">縄文</h1>
    </div>

</body>
</html>
